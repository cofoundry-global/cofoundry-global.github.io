<title>Global Payment Infrastructure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050810;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    flex-direction: column;
    gap: 16px;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: #080c14;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border-radius: 4px;
  }
  .slide svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

  @keyframes dashmove { to { stroke-dashoffset: -16; } }
  .flow { animation: dashmove 3s linear infinite; }
  @keyframes dashmove-fast { to { stroke-dashoffset: -12; } }
  .flow-fast { animation: dashmove-fast 1.5s linear infinite; }

  /* Crypto-specific animations */
  @keyframes crypto-pulse {
    0%, 100% { opacity: 0.15; r: 30; }
    50% { opacity: 0.35; r: 38; }
  }
  @keyframes crypto-flow { to { stroke-dashoffset: -10; } }
  .crypto-flow { animation: crypto-flow 0.8s linear infinite; }

  @keyframes glow-breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Layer visibility */
  .layer { opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
  .layer.visible { opacity: 1; pointer-events: auto; }
  .step { opacity: 0; transition: opacity 0.6s ease; }
  .step.visible { opacity: 1; }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #475569;
    text-align: center;
  }
  .hint span { color: #60a5fa; }
</style>
</head>

<div class="hint" id="hint">Click to advance → <span>Slide 1: Infrastructure Map</span></div>

<script>
  let state = 0;

  const tradSteps = ['t-sender','t-local-us','t-fedwire','t-swift','t-fx','t-money','t-cips','t-local-cn','t-receiver','t-summary'];
  const cryptoSteps = ['c-sender','c-wallet-us','c-arc','c-wallet-cn','c-receiver','c-summary'];

  function show(id) { document.getElementById(id)?.classList.add('visible'); }
  function hide(id) { document.getElementById(id)?.classList.remove('visible'); }
  function showLayer(id) { document.getElementById(id)?.classList.add('visible'); }
  function hideLayer(id) { document.getElementById(id)?.classList.remove('visible'); }

  // Total states:
  // 0: base map
  // 1: trad overlay appears
  // 2-11: trad steps (10 steps)
  // 12: transition to crypto
  // 13-18: crypto steps (6 steps)
  // 19: reset

  function advance() {
    state++;

    if (state === 1) {
      // Show trad overlay
      hideLayer('slide1-info');
      showLayer('trad-overlay');
      document.getElementById('hint').innerHTML = 'Click to advance → <span>Traditional Payment Path</span>';
    }
    else if (state >= 2 && state <= 11) {
      // Reveal trad steps
      let idx = state - 2;
      show(tradSteps[idx]);
      document.getElementById('hint').innerHTML = `Click to advance → <span>Step ${idx + 1} of ${tradSteps.length}</span>`;
    }
    else if (state === 12) {
      // Transition: hide trad, show crypto
      hideLayer('trad-overlay');
      tradSteps.forEach(s => hide(s));
      showLayer('crypto-overlay');
      document.getElementById('hint').innerHTML = 'Click to advance → <span>Now: Crypto Rails</span>';
    }
    else if (state >= 13 && state <= 18) {
      let idx = state - 13;
      show(cryptoSteps[idx]);
      document.getElementById('hint').innerHTML = `Click to advance → <span>Step ${idx + 1} of ${cryptoSteps.length}</span>`;
    }
    else {
      // Reset
      hideLayer('trad-overlay');
      hideLayer('crypto-overlay');
      tradSteps.forEach(s => hide(s));
      cryptoSteps.forEach(s => hide(s));
      showLayer('slide1-info');
      document.getElementById('hint').innerHTML = 'Click to advance → <span>Slide 1: Infrastructure Map</span>';
      state = 0;
    }
  }
</script>
